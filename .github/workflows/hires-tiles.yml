name: 고화질 지도 타일 받기

# Actions 탭 → "고화질 지도 타일 받기" → Run workflow 로 실행한다.
# 쿠로 공식 지도 CDN에서 원본(1024px PNG) 타일을 받아 pk/ 묶음 파일을 다시 만들고 커밋한다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 크롤러 받기 (Acceleratorer/wuwa-map)
        run: git clone --depth 1 https://github.com/Acceleratorer/wuwa-map /tmp/crawler

      - name: 공식 CDN 연결 확인
        run: |
          for u in https://web-static.kurobbs.com/ https://web-static.kurobbs.com/mcmap/tiles/; do
            r=$(curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_total}s' --max-time 20 -H 'referer: https://www.kurobbs.com/' "$u" 2>&1 || true)
            echo "::notice::$u -> $r"
          done
          echo "::notice::DNS $(getent ahosts web-static.kurobbs.com | head -3 | tr '\n' ' ')"

      - name: 공식 지도에서 원본 타일 다운로드
        working-directory: /tmp/crawler
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          set -o pipefail
          node tools/crawl-kuro-map.mjs --tile-size 1024 --output /tmp/kuro --raw-output /tmp/kuro-raw --refresh-tiles true --concurrency 6 2>&1 | tee /tmp/crawl.log || {
            tail -n 15 /tmp/crawl.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: 아이콘은 기존 것 사용 (크롤 결과에 없으면)
        run: |
          if [ ! -d /tmp/kuro/icons ]; then cp -r /tmp/crawler/public/map-packs/private/icons /tmp/kuro/icons; fi

      - name: 타일 묶음·축소 단계 만들기
        run: |
          pip install pillow
          set -o pipefail
          python tools/build_tiles.py /tmp/kuro . 2>&1 | tee /tmp/build.log || {
            tail -n 15 /tmp/build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          tail -n 3 /tmp/build.log | while IFS= read -r line; do echo "::notice::$line"; done

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add pk
          git commit -m "지도 타일 고화질(원본 1024px)로 교체" || echo "변경 없음"
          git push
